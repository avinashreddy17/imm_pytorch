name: celeba-10pts-mini
training:
  ncheckpoint: 200
  n_test: 0
  gradclip: 0.5
  dset: celeba
  train_dset_params:
    dataset: celeba
    subset: train
    order_stream: True
    max_samples: 50000
  test_dset_params:
    dataset: mafl
    subset: test
    order_stream: True
    max_samples: 500
  logdir: ${logdir}/${name}
  datadir: ${celeba_data_dir}
  batch: 16
  allow_growth: True
  optim: Adam
  lr:
    start_val: 0.0001  # Reduce LR by 10x due to high gradients
    step: 20000  # Decay every ~16 epochs  
    decay: 0.95

model:
  gauss_std: 0.10
  gauss_mode: 'rot'
  n_maps: 10
  n_filters: 32
  n_filters_render: 32
  renderer_stride: 2
  min_res: 16
  reconstruction_loss: perceptual
  perceptual:
    backend: torchvision
    l2: True
    comp: ['input','conv1_2','conv2_2','conv3_2','conv4_2','conv5_2']
  loss_mask: True
  channels_bug_fix: True  # Set to False for L2 loss (True only needed for perceptual)

